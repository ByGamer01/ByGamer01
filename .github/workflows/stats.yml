name: profile-stats

# Renders the "GitHub activity" cards of the profile README and publishes them
# as a single commit on the orphan branch "stats" (main's history stays clean).

on:
  schedule:
    # Daily at 21:37 UTC = 23:37 Madrid in summer, 22:37 in winter: the day is almost over.
    # Off the top of the hour because runs scheduled at :00 are the most delayed or dropped.
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if the totals dropped, the previous card is unreadable or no private contributions are reported"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  stats:
    if: github.repository == 'ByGamer01/ByGamer01'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Load the previous card (baseline for the drop check)
        # Only a branch that does not exist means "first run". Any other failure (network, auth,
        # a stats branch without the card) fails the job instead of silently skipping the check.
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/stats > /dev/null; then
            git fetch --quiet --depth=1 origin refs/heads/stats
            git show FETCH_HEAD:activity-light.svg > "$RUNNER_TEMP/prev-activity.svg"
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "::error::cannot query origin for the stats branch (git ls-remote exit $rc)"
              exit 1
            fi
            echo "No stats branch yet; first run."
          fi

      - name: Render SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
          OUT_DIR: ${{ runner.temp }}/stats-out
          PREV_SVG: ${{ runner.temp }}/prev-activity.svg
          ALLOW_DROP: ${{ inputs.allow_drop == true && 'true' || 'false' }}
        run: node .github/scripts/stats.mjs

      - name: Render the contribution snake
        # Dots use the cards' purple scale; the first colour is the empty cell of each GitHub theme.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ${{ runner.temp }}/stats-out/snake-light.svg?color_snake=#1f2328&color_dots=#ebedf0,#d9c6fe,#b48af9,#8A3FFC,#5a22b8
            ${{ runner.temp }}/stats-out/snake-dark.svg?color_snake=#f0f6fc&color_dots=#151b23,#3b2366,#5d34a8,#A371F7,#d2b8ff

      - name: Keep the grid (the snake roams without eating)
        run: node .github/scripts/snake-keep-grid.mjs "$RUNNER_TEMP/stats-out/snake-light.svg" "$RUNNER_TEMP/stats-out/snake-dark.svg"

      - name: Publish to the orphan branch "stats"
        env:
          OUT_DIR: ${{ runner.temp }}/stats-out
        run: |
          set -euo pipefail
          files="activity-light.svg activity-dark.svg monthly-light.svg monthly-dark.svg snake-light.svg snake-dark.svg"
          for f in $files; do
            test -s "$OUT_DIR/$f" || { echo "::error::missing or empty $f"; exit 1; }
          done
          git switch --quiet --orphan stats
          for f in $files; do cp "$OUT_DIR/$f" .; done
          printf '%s\n' \
            "# stats" \
            "" \
            "Auto-generated by [.github/workflows/stats.yml]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/.github/workflows/stats.yml)." \
            "Do not edit: every run replaces this branch with a single new commit." \
            "The SVGs are the activity cards embedded in the profile README." > README.md
          git add README.md $files
          git -c user.name="github-actions[bot]" \
              -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore(stats): update $(date -u +%F)"
          git push --force --quiet origin HEAD:refs/heads/stats
